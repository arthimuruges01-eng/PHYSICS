<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ bot_name }} | Physics study assistant</title>
<style>
  :root {
    --bg: #0a0620;
    --panel: rgba(24,16,58,0.85);
    --chat-bg: rgba(18,12,46,0.75);
    --text: #ece8ff;
    --dim: #9a92c8;
    --accent: #b388ff;
    --accent2: #4dd0e1;
    --line: rgba(179,136,255,0.28);
    --glow: rgba(179,136,255,0.5);
    --on-accent: #12002e;
    --bot-bg: rgba(40,28,92,0.8);
    --bot-text: #ece8ff;
    --user-bg: #3b2a8a;
    --user-text: #ffffff;
    --radius: 20px;
    --logo-radius: 50%;
    --chip-radius: 999px;
    --bubble-bot: 6px 18px 18px 18px;
    --bubble-user: 18px 6px 18px 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  body { background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 60%, #cbb8ff, transparent), radial-gradient(1.5px 1.5px at 40% 80%, #8be9f5, transparent), radial-gradient(2px 2px at 85% 15%, #fff, transparent); background-attachment: fixed; }

  .app-shell {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 22px;
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    
  }

  .logo {
    width: 46px;
    height: 46px;
    border-radius: var(--logo-radius);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 0 18px var(--glow);
  }

  .title-block h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
  .title-block p { margin: 2px 0 0; font-size: 12.5px; color: var(--dim); }

  .reset-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .reset-btn:hover { background: var(--accent); color: var(--on-accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .chips button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 6px 13px;
    border-radius: var(--chip-radius);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chips button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  main.chat-window {
    flex: 1;
    margin-top: 12px;
    background: var(--chat-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 44vh;
    max-height: 60vh;
    
  }

  .msg-row { display: flex; gap: 10px; max-width: 90%; animation: pop 0.25s ease; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: var(--logo-radius);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: transparent;
  }
  .msg-row.user .avatar { border-color: var(--accent2); color: var(--accent2); }

  .bubble {
    padding: 10px 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.bot .bubble {
    background: var(--bot-bg);
    color: var(--bot-text);
    border: 1px solid var(--line);
    border-radius: var(--bubble-bot);
  }
  .msg-row.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-radius: var(--bubble-user);
  }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  form.composer {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    padding: 10px;
    max-height: 120px;
  }
  .composer textarea::placeholder { color: var(--dim); }

  .send-btn {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    border: none;
    border-radius: var(--chip-radius);
    padding: 0 22px;
    font-weight: 700;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    height: 42px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .footnote { text-align: center; color: var(--dim); font-size: 11.5px; margin: 12px 4px 0; line-height: 1.4; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 560px) {
    .msg-row { max-width: 100%; }
    header.topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="logo">&#9883;</div>
      <div class="title-block">
        <h1>{{ bot_name }}</h1>
        <p>Physics study assistant</p>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">New Orbit</button>
    </header>

    <div class="chips" id="chips">
      <button type="button">Newton's laws</button>
      <button type="button">Optics</button>
      <button type="button">Quantum</button>
      <button type="button">Relativity</button>
      <button type="button">Waves</button>
      <button type="button">Thermodynamics</button>
    </div>

    <main class="chat-window" id="chatWindow">
      <div class="msg-row bot">
        <div class="avatar">PH</div>
        <div class="bubble">Hi! I'm Physics Buddy. Ask me about mechanics, waves, electricity, quantum physics and more.</div>
      </div>
    </main>

    <form class="composer" id="chatForm">
      <textarea id="userInput" rows="1" placeholder="Ask a physics question..."></textarea>
      <button class="send-btn" id="sendBtn" type="submit">Send</button>
    </form>

    <p class="footnote">I only answer physics study questions.</p>
  </div>

<script>
  const AVATAR = 'PH';
  const chatWindow = document.getElementById('chatWindow');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const chips = document.getElementById('chips');

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function buildRow(sender) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = sender === 'user' ? 'YOU' : AVATAR;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
    return { row, bubble };
  }

  function addMessage(text, sender) {
    buildRow(sender).bubble.textContent = text;
  }

  function showTyping() {
    const { row, bubble } = buildRow('bot');
    row.id = 'typingRow';
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  }

  function hideTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  }

  async function sendMessage(message) {
    addMessage(message, 'user');
    userInput.value = '';
    autoResize();
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      hideTyping();
      addMessage(data.reply || 'No response received.', 'bot');
    } catch (error) {
      hideTyping();
      addMessage('Network error: could not reach the server.', 'bot');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  chatForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = userInput.value.trim();
    if (message) sendMessage(message);
  });

  userInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      chatForm.requestSubmit();
    }
  });

  userInput.addEventListener('input', autoResize);

  chips.addEventListener('click', (event) => {
    if (event.target.tagName !== 'BUTTON') return;
    userInput.value = 'Explain ' + event.target.textContent;
    userInput.focus();
    autoResize();
  });

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', { method: 'POST' });
    chatWindow.innerHTML = '';
    addMessage('New orbit set. Which physics topic shall we explore?', 'bot');
  });
</script>
</body>
</html>
